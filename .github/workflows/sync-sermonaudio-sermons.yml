name: Sync SermonAudio sermons

on:
  schedule:
    - cron: "15 10 * * *" # daily at 10:15 UTC (offset from the YouTube sync)
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch sermons from SermonAudio
        env:
          SERMONAUDIO_API_KEY: ${{ secrets.SERMONAUDIO_API_KEY }}
        run: node scripts/sync-sermonaudio-sermons.mjs

      - name: Commit and push if changed
        run: |
          git config user.name "sermon sync"
          git config user.email "actions@users.noreply.github.com"
          git add content/sermons/sermonaudio.json
          if git diff --cached --quiet; then
            echo "No changes to sync."
            exit 0
          fi
          git commit -m "Sync SermonAudio sermons"
          git push
